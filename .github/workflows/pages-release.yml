# Activated for the first release explicitly authorized by the owner on 2026-11-22.
name: Manually approved GitHub Pages release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Separate publication approval required. Type PUBLISH money'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'yongliancai/money' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH money'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          VITE_API_BASE_URL: ''
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy previously verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
